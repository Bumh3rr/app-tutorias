<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ══════════════════════════════════════════════════════
     Modal: Generar sesiones masivas
     Recibe: grupo (entidad Grupo completa)
══════════════════════════════════════════════════════ -->
<div th:fragment="modal(grupo)" class="modal fade" id="modalGenerarSesiones" tabindex="-1" aria-hidden="true">
<style>
/* ── Modal scoped styles ── */
#modalGenerarSesiones .modal-content {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
}
#modalGenerarSesiones .gs-info-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12.5px;
}
#modalGenerarSesiones .gs-info-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: rgba(255,255,255,0.55);
    margin-right: 16px;
}
#modalGenerarSesiones .gs-info-chip svg { opacity:.5; flex-shrink:0; }
#modalGenerarSesiones .gs-info-chip strong { color: rgba(255,255,255,0.85); font-weight:500; }
/* Params section */
#modalGenerarSesiones .gs-params {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 16px;
}
/* PAT checkbox items */
#modalGenerarSesiones .gs-pat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
}
#modalGenerarSesiones .gs-pat-item:last-child { border-bottom: none; }
#modalGenerarSesiones .gs-pat-name { font-size: 12.5px; font-weight: 500; flex-grow:1; }
#modalGenerarSesiones .gs-pat-count { font-size: 11px; opacity: .45; }
#modalGenerarSesiones .badge-pat-general {
    background: rgba(16,185,129,0.12);
    color: #34d399;
    border: 1px solid rgba(16,185,129,0.2);
    font-size: 10px; padding: 2px 7px; border-radius:4px;
}
#modalGenerarSesiones .badge-pat-carrera {
    background: rgba(99,102,241,0.12);
    color: #a5b4fc;
    border: 1px solid rgba(99,102,241,0.2);
    font-size: 10px; padding: 2px 7px; border-radius:4px;
}
/* DIA_SEMANA banner */
#modalGenerarSesiones #bannerDiaSemana {
    border-radius: 10px;
    border: 1px solid rgba(251,191,36,0.3);
    background: rgba(251,191,36,0.07);
    color: #fbbf24;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.22s ease;
    margin-bottom: 0;
}
#modalGenerarSesiones #bannerDiaSemana.visible {
    max-height: 120px;
    opacity: 1;
    margin-bottom: 14px;
}
/* Table */
#modalGenerarSesiones .gs-table-wrap {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
}
#modalGenerarSesiones .gs-table { font-size: 12.5px; margin:0; }
#modalGenerarSesiones .gs-table th {
    font-size: 10.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.07em; opacity:.45; padding: 9px 14px;
    border-color: rgba(255,255,255,0.07) !important;
}
#modalGenerarSesiones .gs-table td {
    padding: 9px 14px; vertical-align:middle;
    border-color: rgba(255,255,255,0.05) !important;
}
/* Left-border conflict indicator — NO row background */
#modalGenerarSesiones .gs-table tr.conflict-warn td:first-child {
    box-shadow: inset 3px 0 0 #fbbf24;
}
#modalGenerarSesiones .gs-table tr.conflict-danger td:first-child {
    box-shadow: inset 3px 0 0 #f87171;
}
/* Activity badges */
#modalGenerarSesiones .badge-act-general {
    background: rgba(16,185,129,0.1);
    color: #34d399;
    border: 1px solid rgba(16,185,129,0.18);
    font-size: 11px; padding: 2px 8px; border-radius:5px;
}
#modalGenerarSesiones .badge-act-carrera {
    background: rgba(99,102,241,0.1);
    color: #a5b4fc;
    border: 1px solid rgba(99,102,241,0.18);
    font-size: 11px; padding: 2px 8px; border-radius:5px;
}
/* Loading overlay */
#modalGenerarSesiones #gsLoadingOverlay {
    position: absolute; inset: 0;
    background: rgba(13,15,20,0.7);
    display: flex; align-items:center; justify-content:center;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 5;
}
#modalGenerarSesiones #gsLoadingOverlay.visible { opacity: 1; pointer-events: auto; }
/* Summary mini cards */
#modalGenerarSesiones .gs-mini-stat {
    display: inline-flex; flex-direction:column; align-items:center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; padding: 8px 14px;
    min-width: 90px;
}
#modalGenerarSesiones .gs-mini-num { font-size: 18px; font-weight:700; line-height:1; }
#modalGenerarSesiones .gs-mini-lbl { font-size: 10px; opacity:.45; margin-top:3px; text-align:center; }
/* Generar btn transition */
#modalGenerarSesiones #btnGenerar { transition: opacity 0.2s ease, background 0.2s ease; }
</style>

    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <!-- HEADER -->
            <div class="modal-header border-0 pb-2">
                <div>
                    <h5 class="modal-title fw-semibold mb-0">Generar sesiones del semestre</h5>
                    <p class="text-body-secondary small mb-0"
                       th:text="${grupo.nombre + ' — ' + (grupo.carrera?.nombre ?: 'Sin carrera')}">Grupo — Carrera</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body pt-2">

                <!-- SECTION 1: Group info card -->
                <div class="gs-info-card mb-3 d-flex flex-wrap gap-3">
                    <span class="gs-info-chip">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        Tutor: <strong th:text="${grupo.tutor != null ? grupo.tutor.nombre + ' ' + grupo.tutor.apellido : 'Sin asignar'}">—</strong>
                    </span>
                    <span class="gs-info-chip" th:if="${grupo.aula != null and !grupo.aula.isEmpty()}">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                        Aula: <strong th:text="${grupo.aula}">—</strong>
                    </span>
                    <span class="gs-info-chip" th:if="${grupo.diaSemana != null and !grupo.diaSemana.isEmpty()}">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        Día: <strong th:text="${grupo.diaSemana}">—</strong>
                    </span>
                    <span class="gs-info-chip" th:if="${grupo.horario != null and !grupo.horario.isEmpty()}">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        Horario: <strong th:text="${grupo.horario}">—</strong>
                    </span>
                </div>

                <!-- SECTION 2: Params (date + PAT) -->
                <div class="row g-3 mb-3">
                    <!-- Left: Date -->
                    <div class="col-md-5">
                        <div class="gs-params h-100">
                            <p class="mb-2" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.4;">Fecha de inicio</p>
                            <label class="form-label small mb-1" for="fechaInicioInput">Fecha Semana 1</label>
                            <input type="date" id="fechaInicioInput" class="form-control form-control-sm" style="max-width:180px">
                            <p class="mt-2 mb-0" id="sugerenciaDia" style="font-size:11px;opacity:.5;"></p>
                        </div>
                    </div>
                    <!-- Right: PAT selection -->
                    <div class="col-md-7">
                        <div class="gs-params h-100">
                            <p class="mb-2" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.4;">Plan de Acción Tutorial</p>
                            <div id="patCheckboxList">
                                <p class="text-body-secondary small">Cargando PATs…</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Error box -->
                <div id="previewError" class="alert alert-danger d-none mb-3" role="alert"></div>

                <!-- SECTION 3: DIA_SEMANA banner -->
                <div id="bannerDiaSemana" role="alert" style="padding:12px 16px;">
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        <span id="bannerDiaSemanaMsg" class="flex-grow-1" style="font-size:13px;"></span>
                        <button type="button" id="btnAjustarDia" class="btn btn-sm"
                                style="background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.35);color:#fbbf24;white-space:nowrap;">
                            Ajustar fecha →
                        </button>
                    </div>
                </div>

                <!-- SECTION 4: Table area with loading overlay -->
                <div id="previewTableArea" class="d-none">
                    <div class="gs-table-wrap">
                        <div id="gsLoadingOverlay">
                            <div class="text-center">
                                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                                <p class="small text-body-secondary mt-2 mb-0">Recalculando…</p>
                            </div>
                        </div>
                        <table class="table gs-table">
                            <thead>
                                <tr>
                                    <th style="width:48px">#</th>
                                    <th style="width:140px">Fecha</th>
                                    <th style="width:80px">Día</th>
                                    <th>Actividad</th>
                                    <th style="width:110px">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="previewTbody"></tbody>
                        </table>
                    </div>

                    <!-- SECTION 5: Summary -->
                    <div id="previewResumen" class="d-flex gap-2 flex-wrap mt-3"></div>
                </div>

            </div><!-- /modal-body -->

            <!-- FOOTER -->
            <div class="modal-footer border-0 pt-1">
                <!-- hidden button to store grupo id for JS -->
                <button type="button" id="btnRecalcular" class="d-none"
                        th:data-grupo="${grupo.id}"
                        th:data-dia="${grupo.diaSemana}">Recalcular</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <form th:action="@{'/admin/grupo/' + ${grupo.id} + '/sesiones/generar'}" method="post" id="formGenerar">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="fechaInicio" id="fechaInicioHidden">
                    <input type="hidden" name="idsPats" id="idsPatsHidden">
                    <button type="submit" class="btn btn-primary btn-sm" id="btnGenerar" disabled
                            data-bs-toggle="tooltip" data-bs-placement="top"
                            title="Calcula el preview primero">
                        Generar 10 sesiones
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Script fragment — receives only the grupo.id -->
<script th:fragment="script(idGrupo)">
(function() {
    'use strict';

    // ── DOM references ──
    const btnRecalcular   = document.getElementById('btnRecalcular');
    const GRUPO_ID        = parseInt(btnRecalcular.dataset.grupo, 10);
    const GRUPO_DIA       = (btnRecalcular.dataset.dia || '').toUpperCase().trim();

    const fechaInput      = document.getElementById('fechaInicioInput');
    const fechaHidden     = document.getElementById('fechaInicioHidden');
    const idsPatsHidden   = document.getElementById('idsPatsHidden');
    const btnGenerar      = document.getElementById('btnGenerar');
    const previewError    = document.getElementById('previewError');
    const previewTableArea= document.getElementById('previewTableArea');
    const previewTbody    = document.getElementById('previewTbody');
    const previewResumen  = document.getElementById('previewResumen');
    const patCheckboxList = document.getElementById('patCheckboxList');
    const bannerDia       = document.getElementById('bannerDiaSemana');
    const bannerDiaMsg    = document.getElementById('bannerDiaSemanaMsg');
    const btnAjustarDia   = document.getElementById('btnAjustarDia');
    const sugerenciaDia   = document.getElementById('sugerenciaDia');
    const loadingOverlay  = document.getElementById('gsLoadingOverlay');

    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]')?.content;
    const CSRF_TOKEN  = document.querySelector('meta[name="_csrf"]')?.content;

    let debounceTimer = null;
    let patsInitialized = false;
    let fechaSugeridaActual = null;

    // ── Date helpers ──
    const DIAS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const MESES_ABREV = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const DIAS_ABREV  = ['dom','lun','mar','mié','jue','vie','sáb'];

    function formatFechaLarga(isoDate) {
        if (!isoDate) return '—';
        const [y, m, d] = isoDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return `${DIAS_ABREV[dt.getDay()]} ${String(d).padStart(2,'0')} ${MESES_ABREV[m-1]} ${y}`;
    }

    function todayIso() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ── PAT checkboxes ──
    function getSelectedPats() {
        return [...document.querySelectorAll('#patCheckboxList input[type=checkbox]:checked')]
            .map(cb => parseInt(cb.value, 10));
    }

    function renderPatCheckboxes(patsDisponibles, idsPatsUsados) {
        if (patsInitialized) return; // only build once
        patsInitialized = true;

        if (!patsDisponibles || patsDisponibles.length === 0) {
            patCheckboxList.innerHTML = '<p class="text-body-secondary small mb-0" style="opacity:.5">No hay PATs disponibles para este grupo.</p>';
            return;
        }

        patCheckboxList.innerHTML = '';
        const usadosSet = new Set(idsPatsUsados || []);

        patsDisponibles.forEach(pat => {
            const checked = pat.seleccionadoPorDefecto;
            const tipoBadge = pat.tipo === 'GENERAL'
                ? '<span class="badge-pat-general">GENERAL</span>'
                : `<span class="badge-pat-carrera">CARRERA</span>`;

            const item = document.createElement('label');
            item.className = 'gs-pat-item';
            item.innerHTML = `
                <input type="checkbox" class="form-check-input m-0" value="${pat.id}" ${checked ? 'checked' : ''}>
                <span class="gs-pat-name">${escHtml(pat.nombre)}</span>
                ${tipoBadge}
                <span class="gs-pat-count">${pat.totalActividades} act.</span>
            `;
            patCheckboxList.appendChild(item);
        });

        // Recalculate when PAT selection changes (with debounce)
        patCheckboxList.addEventListener('change', () => scheduleRecalculo());
    }

    // ── DIA_SEMANA banner ──
    function actualizarBannerDia(data) {
        if (data.tieneDiaSemanaConflicto && data.fechaSugeridaGlobal) {
            fechaSugeridaActual = data.fechaSugeridaGlobal;
            const [sy, sm, sd] = data.fechaSugeridaGlobal.split('-').map(Number);
            const fechaFmt = `${String(sd).padStart(2,'0')}/${String(sm).padStart(2,'0')}/${sy}`;
            bannerDiaMsg.textContent =
                `La fecha elegida es ${data.sesiones[0]?.diaSemana || ''}, pero este grupo se imparte los ${data.diaSemanaGrupo}.`;
            btnAjustarDia.textContent = `Ajustar al ${data.diaSugeridoDisplay} ${fechaFmt} →`;
            bannerDia.classList.add('visible');
        } else {
            fechaSugeridaActual = null;
            bannerDia.classList.remove('visible');
        }
    }

    function actualizarSugerenciaDia(data) {
        if (data.diaSemanaGrupo && !data.tieneDiaSemanaConflicto) {
            sugerenciaDia.textContent = `✓ Fecha en ${data.diaSemanaGrupo}, correcto.`;
            sugerenciaDia.style.color = '#34d399';
        } else if (data.diaSemanaGrupo && data.fechaSugeridaGlobal) {
            const [sy, sm, sd] = data.fechaSugeridaGlobal.split('-').map(Number);
            sugerenciaDia.textContent = `Sugerencia: próximo ${data.diaSugeridoDisplay} (${String(sd).padStart(2,'0')}/${String(sm).padStart(2,'0')}/${sy})`;
            sugerenciaDia.style.color = '';
        } else {
            sugerenciaDia.textContent = '';
        }
    }

    // ── Table render ──
    function renderTabla(data) {
        previewTbody.innerHTML = '';
        data.sesiones.forEach(s => {
            const tipos = s.conflictos.map(c => c.tipo);
            const esDiaSemana   = tipos.includes('DIA_SEMANA');
            const esPeligroso   = tipos.some(t => t === 'AULA_OCUPADA' || t === 'TUTOR_OCUPADO');
            const esSinAct      = tipos.includes('SIN_ACTIVIDAD') && tipos.length === 1 && !esDiaSemana;

            const rowClass = esPeligroso ? 'conflict-danger'
                           : esDiaSemana ? 'conflict-warn'
                           : '';

            // Activity badge
            let actHtml;
            if (s.nombreActividad) {
                const cls = s.origenPat === 'GENERAL' ? 'badge-act-general' : 'badge-act-carrera';
                const lbl = s.origenPat === 'GENERAL' ? 'PAT General' : 'PAT Carrera';
                actHtml = `<span class="${cls}" title="${escHtml(s.patNombre || '')}">${escHtml(s.nombreActividad)}</span>
                           <span style="font-size:10px;opacity:.4;display:block;margin-top:2px">${lbl}</span>`;
            } else {
                actHtml = `<span style="color:rgba(255,255,255,.35);font-size:13px">—</span>`;
            }

            // Status badge
            let statusHtml;
            if (!s.tieneConflictos) {
                statusHtml = `<span class="badge rounded-pill" style="background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.22);font-size:10.5px">OK</span>`;
            } else if (esPeligroso) {
                const conflictoDesc = s.conflictos.filter(c => c.tipo !== 'SIN_ACTIVIDAD' && c.tipo !== 'DIA_SEMANA')
                    .map(c => c.descripcion).join(' | ');
                statusHtml = `<span class="badge rounded-pill" style="background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.22);font-size:10.5px" title="${escHtml(conflictoDesc)}">Conflicto</span>`;
            } else if (esDiaSemana) {
                statusHtml = `<span class="badge rounded-pill" style="background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.22);font-size:10.5px">Día incorrecto</span>`;
            } else {
                statusHtml = `<span class="badge rounded-pill" style="background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);font-size:10.5px">Sin actividad</span>`;
            }

            const tr = document.createElement('tr');
            if (rowClass) tr.className = rowClass;
            tr.innerHTML = `
                <td class="fw-semibold text-center" style="color:rgba(255,255,255,.5)">${s.semana}</td>
                <td class="font-monospace" style="font-size:12px">${formatFechaLarga(s.fecha)}</td>
                <td style="font-size:12px;opacity:.7">${escHtml(s.diaSemana)}</td>
                <td>${actHtml}</td>
                <td>${statusHtml}</td>
            `;
            previewTbody.appendChild(tr);
        });
    }

    // ── Summary ──
    function renderResumen(data) {
        const sinConflBloq = data.sesiones.filter(s =>
            s.conflictos.some(c => c.tipo === 'AULA_OCUPADA' || c.tipo === 'TUTOR_OCUPADO')).length;
        const sinAct = data.totalSinActividad;
        const conAct = data.totalConActividad;

        let html = `
            <div class="gs-mini-stat">
                <span class="gs-mini-num">10</span>
                <span class="gs-mini-lbl">a generar</span>
            </div>
            <div class="gs-mini-stat">
                <span class="gs-mini-num" style="color:#34d399">${conAct}</span>
                <span class="gs-mini-lbl">con actividad</span>
            </div>
            <div class="gs-mini-stat">
                <span class="gs-mini-num" style="color:rgba(255,255,255,.4)">${sinAct}</span>
                <span class="gs-mini-lbl">sin actividad</span>
            </div>`;
        if (sinConflBloq > 0) {
            html += `<div class="gs-mini-stat">
                <span class="gs-mini-num" style="color:#f87171">${sinConflBloq}</span>
                <span class="gs-mini-lbl">con conflicto</span>
            </div>`;
        }
        previewResumen.innerHTML = html;
    }

    // ── Main preview loader ──
    async function cargarPreview(showOverlay) {
        const fecha = fechaInput.value;
        if (!fecha) return;

        previewError.classList.add('d-none');

        if (showOverlay && previewTableArea.classList.contains('d-none') === false) {
            loadingOverlay.classList.add('visible');
        } else if (!showOverlay) {
            previewTableArea.classList.add('d-none');
        }
        btnGenerar.disabled = true;

        const selectedPats = getSelectedPats();
        const body = `fechaInicio=${encodeURIComponent(fecha)}&idsPats=${encodeURIComponent(selectedPats.join(','))}`;
        const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        if (CSRF_HEADER && CSRF_TOKEN) headers[CSRF_HEADER] = CSRF_TOKEN;

        try {
            const res = await fetch(`/admin/grupo/${GRUPO_ID}/sesiones/preview`, {
                method: 'POST', headers, body
            });
            const data = await res.json();

            loadingOverlay.classList.remove('visible');

            if (data.error) {
                previewError.textContent = data.error;
                previewError.classList.remove('d-none');
                return;
            }

            // First response: initialize PAT checkboxes
            renderPatCheckboxes(data.patsDisponibles, data.idsPatsUsados);

            actualizarBannerDia(data);
            actualizarSugerenciaDia(data);
            renderTabla(data);
            renderResumen(data);

            fechaHidden.value = fecha;
            idsPatsHidden.value = selectedPats.join(',');
            previewTableArea.classList.remove('d-none');

            if (data.puedoGenerar) {
                btnGenerar.disabled = false;
                btnGenerar.title = '';
                const bsTooltip = bootstrap.Tooltip.getInstance(btnGenerar);
                if (bsTooltip) bsTooltip.dispose();
            }
        } catch (e) {
            loadingOverlay.classList.remove('visible');
            previewError.textContent = 'Error de red al calcular el preview.';
            previewError.classList.remove('d-none');
        }
    }

    function scheduleRecalculo() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => cargarPreview(true), 320);
    }

    // ── Auto-fix button ──
    btnAjustarDia.addEventListener('click', () => {
        if (fechaSugeridaActual) {
            fechaInput.value = fechaSugeridaActual;
            bannerDia.classList.remove('visible');
            cargarPreview(false);
        }
    });

    // ── Events ──
    fechaInput.addEventListener('change', () => scheduleRecalculo());

    document.getElementById('modalGenerarSesiones').addEventListener('shown.bs.modal', () => {
        if (!fechaInput.value) fechaInput.value = todayIso();
        cargarPreview(false);
    });

    // ── Helpers ──
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }
})();
</script>

</body>
</html>
