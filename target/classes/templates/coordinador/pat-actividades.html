<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades PAT | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3 th:text="${pat?.nombre ?: 'Actividades del PAT'}">PAT</h3>
                    <p class="text-body-secondary mb-0" th:text="${pat?.descripcion ?: ''}">—</p>
                </div>
                <a th:href="@{/coordinador/pat}" class="btn btn-outline-secondary btn-sm">← PAT de mi Carrera</a>
            </div>

            <!-- Metadatos del PAT -->
            <div class="glass-surface mb-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <p class="text-body-secondary small text-uppercase mb-1" style="letter-spacing:.06em;font-size:.72rem">Tipo</p>
                        <span class="badge"
                              th:classappend="${pat?.esGeneral == 1 ? 'bg-info text-dark' : 'bg-primary'}"
                              th:text="${pat?.esGeneral == 1 ? 'General' : 'Por carrera'}">—</span>
                    </div>
                    <div class="col-md-3" th:if="${pat?.esGeneral != 1}">
                        <p class="text-body-secondary small text-uppercase mb-1" style="letter-spacing:.06em;font-size:.72rem">Carrera</p>
                        <span class="small" th:text="${pat?.carrera?.nombre ?: '—'}">—</span>
                    </div>
                    <div class="col-md-3">
                        <p class="text-body-secondary small text-uppercase mb-1" style="letter-spacing:.06em;font-size:.72rem">Semestre</p>
                        <span class="small" th:text="${pat?.semestre != null ? pat.semestre.periodo + ' ' + pat.semestre.anio : '—'}">—</span>
                    </div>
                    <div class="col-md-3">
                        <p class="text-body-secondary small text-uppercase mb-1" style="letter-spacing:.06em;font-size:.72rem">Actividades</p>
                        <span class="small" th:text="${actividades != null ? actividades.size() : 0}">0</span>
                    </div>
                </div>
            </div>

            <!-- Sin actividades -->
            <div th:if="${actividades == null or actividades.isEmpty()}" class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="mb-3" style="opacity:.3">
                    <polyline points="9 11 12 14 22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                <h5>Sin actividades</h5>
                <p>Este PAT no tiene actividades registradas.</p>
            </div>

            <!-- Tabla de actividades -->
            <div th:if="${actividades != null and !actividades.isEmpty()}" class="glass-surface">
                <div class="table-wrapper">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Semana</th>
                                    <th>Nombre</th>
                                    <th>Fecha</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="actividad : ${actividades}">
                                    <td>
                                        <span class="badge bg-secondary"
                                              th:text="${actividad.semana != null ? actividad.semana : '—'}">—</span>
                                    </td>
                                    <td class="fw-semibold" th:text="${actividad.nombre ?: '—'}">—</td>
                                    <td class="small text-body-secondary"
                                        th:text="${actividad.fecha != null ? #temporals.format(actividad.fecha, 'dd/MM/yyyy') : '—'}">—</td>
                                    <td class="small text-body-secondary" th:text="${actividad.descripcion ?: '—'}">—</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
