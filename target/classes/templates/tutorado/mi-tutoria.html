<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tutoría | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Mi Tutoría</h3>
                    <p th:if="${tutorado != null}"
                       th:text="${tutorado.nombre + ' ' + tutorado.apellido}">Tutorado</p>
                </div>
            </div>

            <div th:if="${tutorado == null}" class="alert alert-warning">
                No se encontró información de tutorado asociada a tu cuenta.
            </div>

            <div th:if="${tutorado != null}">

                <!-- Datos del tutorado -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header"><h6 class="mb-0">Mis datos</h6></div>
                            <div class="card-body">
                                <div class="row g-2">
                                    <div class="col-6">
                                        <p class="text-muted small mb-1">Nombre</p>
                                        <p class="fw-semibold" th:text="${tutorado.nombre + ' ' + tutorado.apellido}">—</p>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted small mb-1">Núm. de control</p>
                                        <p th:text="${tutorado.numeroControl ?: '—'}">—</p>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted small mb-1">Carrera</p>
                                        <p th:text="${tutorado.carrera?.nombre ?: '—'}">—</p>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted small mb-1">Correo</p>
                                        <p th:text="${tutorado.email ?: '—'}">—</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Resumen de asistencia -->
                    <div class="col-md-6" th:if="${resumen != null}">
                        <div class="card h-100">
                            <div class="card-header"><h6 class="mb-0">Asistencia</h6></div>
                            <div class="card-body">
                                <div class="row g-2 text-center">
                                    <div class="col-4">
                                        <div class="stat-card py-3">
                                            <div class="stat-label">Sesiones</div>
                                            <div class="stat-value" th:text="${resumen.totalSesiones}">0</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="stat-card py-3">
                                            <div class="stat-label">Acreditadas</div>
                                            <div class="stat-value text-success" th:text="${resumen.totalAcreditadas}">0</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="stat-card py-3">
                                            <div class="stat-label">Asistencia</div>
                                            <div class="stat-value"
                                                 th:text="${#numbers.formatDecimal(resumen.porcentaje, 1, 0) + '%'}">0%</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
