<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Sesión | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main d-flex justify-content-center align-items-start">
            <div class="form-card w-100 mx-auto" style="max-width: 640px;">

                <h3 class="text-center mb-1">Reporte de sesión</h3>
                <p class="text-center text-body-secondary small mb-1">Anexo 19</p>
                <p class="text-center text-body-secondary small mb-4">
                    Semana <span th:text="${sesion.semana}">?</span>
                    &mdash; <span th:text="${sesion.grupo?.nombre ?: '—'}"></span>
                </p>

                <!-- Estatus del reporte si ya existe -->
                <div th:if="${reporte != null}" class="alert alert-info d-flex align-items-center gap-2 mb-3 py-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span class="small">Reporte existente &mdash; Estatus:
                        <strong th:text="${reporte.estatusRevision ?: 'PENDIENTE'}">PENDIENTE</strong>
                    </span>
                </div>

                <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show mb-3">
                    <span th:text="${msg_error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form method="post" th:action="@{/tutor/sesiones/{id}/reporte(id=${sesion.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción de la actividad <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="descripcionActividad" rows="5" required
                                  placeholder="Describe la actividad realizada en la sesión..."
                                  th:text="${reporte?.descripcionActividad}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Observaciones <span class="text-body-secondary fw-normal">(opcional)</span></label>
                        <textarea class="form-control" name="observaciones" rows="3"
                                  placeholder="Observaciones adicionales, acuerdos, compromisos..."
                                  th:text="${reporte?.observaciones}"></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Alumnos presentes</label>
                            <input type="number" class="form-control" name="alumnosPresentes" min="0"
                                   th:value="${reporte?.alumnosPresentes ?: alumnosPresentesCount}"
                                   placeholder="0">
                            <div class="form-text" th:if="${alumnosPresentesCount > 0}">
                                Calculado de asistencias: <span th:text="${alumnosPresentesCount}">0</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Fecha de entrega <span class="text-body-secondary fw-normal">(opcional)</span></label>
                            <input type="date" class="form-control" name="fechaEntrega"
                                   th:value="${reporte?.fechaEntrega != null ? #dates.format(reporte.fechaEntrega, 'yyyy-MM-dd') : ''}">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-info text-dark flex-grow-1">
                            <span th:text="${reporte != null ? 'Actualizar reporte' : 'Guardar reporte'}">Guardar</span>
                        </button>
                        <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

            </div>
        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
