<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Necesidades | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Detección de Necesidades</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${semestreVigente != null ? semestreVigente.periodo + ' ' + semestreVigente.anio : ''}"></p>
                </div>
                <a th:href="@{/tutor/dashboard}" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
            </div>

            <div th:if="${msg_success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${msg_success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${asignaciones == null or #lists.isEmpty(asignaciones)}" class="alert alert-info">
                No tienes tutorados asignados en el semestre vigente.
            </div>

            <div th:if="${asignaciones != null and !#lists.isEmpty(asignaciones)}" class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h6 class="mb-0">Tutorados y estado de detección</h6>
                    <div>
                        <span class="badge bg-success me-1"
                              th:text="${#lists.size(asignaciones.?[deteccionAplicada[tutorado.id] == true])} + ' aplicadas'">0 aplicadas</span>
                        <span class="badge bg-warning text-dark"
                              th:text="${#lists.size(asignaciones.?[deteccionAplicada[tutorado.id] != true])} + ' pendientes'">0 pendientes</span>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Tutorado</th>
                                    <th>No. Control</th>
                                    <th>Grupo</th>
                                    <th class="text-center">Detección</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="gt : ${asignaciones}">
                                    <td>
                                        <span class="fw-semibold"
                                              th:text="${gt.tutorado.nombre + ' ' + gt.tutorado.apellido}">—</span>
                                    </td>
                                    <td class="text-body-secondary small"
                                        th:text="${gt.tutorado.numeroControl}">—</td>
                                    <td class="small" th:text="${gt.grupo?.nombre ?: '—'}">—</td>
                                    <td class="text-center">
                                        <span th:if="${deteccionAplicada[gt.tutorado.id]}"
                                              class="badge bg-success">Aplicada</span>
                                        <span th:if="${!deteccionAplicada[gt.tutorado.id]}"
                                              class="badge bg-warning text-dark">Pendiente</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/tutor/deteccion/{id}(id=${gt.tutorado.id})}"
                                           class="btn btn-sm"
                                           th:classappend="${deteccionAplicada[gt.tutorado.id] ? 'btn-outline-secondary' : 'btn-primary'}">
                                            <span th:text="${deteccionAplicada[gt.tutorado.id] ? 'Ver / nueva' : 'Aplicar ahora'}">Aplicar</span>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
