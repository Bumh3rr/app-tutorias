<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Grupos | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Mis Grupos</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${semestreVigente != null ? semestreVigente.periodo + ' ' + semestreVigente.anio : ''}"></p>
                </div>
                <a th:href="@{/tutor/dashboard}" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
            </div>

            <div th:if="${grupos == null or grupos.isEmpty()}" class="alert alert-info">
                No tienes grupos asignados en el semestre vigente. Si esto es un error, contacta a la Coordinación Institucional de Tutorías.
            </div>

            <div th:if="${grupos != null and !grupos.isEmpty()}" class="row g-3">
                <div th:each="g : ${grupos}" class="col-md-6 col-xl-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-start justify-content-between mb-3">
                                <div>
                                    <h5 class="mb-1" th:text="${g.nombre}">Grupo</h5>
                                    <span class="badge bg-secondary" th:text="${g.carrera?.nombre ?: '—'}"></span>
                                </div>
                                <span class="badge bg-primary-subtle text-primary-emphasis"
                                      th:text="${conteoAlumnos.getOrDefault(g.id, 0) + ' alumnos'}"></span>
                            </div>
                            <ul class="list-unstyled small text-body-secondary mb-3">
                                <li th:if="${g.aula != null}">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
                                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                                    </svg>
                                    Aula <span th:text="${g.aula}"></span>
                                </li>
                                <li th:if="${g.diaSemana != null}">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
                                        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                                    </svg>
                                    <span th:text="${g.diaSemana}"></span>
                                    <span th:if="${g.horario != null}" th:text="' · ' + ${g.horario}"></span>
                                </li>
                                <li th:if="${g.semestre != null}">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
                                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                    </svg>
                                    <span th:text="${g.semestre.periodo + ' ' + g.semestre.anio}"></span>
                                </li>
                            </ul>
                        </div>
                        <div class="card-footer bg-transparent border-top-0 pt-0">
                            <a th:href="@{/tutor/grupos/{id}(id=${g.id})}"
                               class="btn btn-primary btn-sm w-100">Ver detalle del grupo</a>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
