<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Evidencia | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
    <style>
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .upload-zone:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); }
        .upload-zone.has-file { border-color: rgba(25,135,84,0.5); background: rgba(25,135,84,0.06); }
        .upload-icon { width: 48px; height: 48px; margin: 0 auto 12px; opacity: .5; }
        #archivoEvidencia { display: none; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main d-flex justify-content-center align-items-start">
            <div class="form-card w-100 mx-auto" style="max-width: 600px;">

                <h3 class="text-center mb-1">Subir evidencia</h3>
                <p class="text-center text-body-secondary small mb-4">
                    Semana <span th:text="${sesion.semana}">?</span>
                    &mdash; <span th:text="${sesion.grupo?.nombre ?: '—'}"></span>
                </p>

                <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show mb-3">
                    <span th:text="${msg_error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Evidencias ya subidas -->
                <div th:unless="${evidencias.isEmpty()}" class="mb-4">
                    <h6 class="text-body-secondary text-uppercase mb-2" style="font-size:.72rem; letter-spacing:.08em">Evidencias subidas</h6>
                    <ul class="list-group list-group-flush">
                        <li th:each="ev : ${evidencias}" class="list-group-item d-flex align-items-center justify-content-between px-0">
                            <span class="small text-body-secondary" th:text="${ev.archivoUrl}">archivo.pdf</span>
                            <span class="badge"
                                  th:classappend="${ev.estatusValidacion == 'VALIDADA' ? 'bg-success' : (ev.estatusValidacion == 'RECHAZADA' ? 'bg-danger' : 'bg-warning text-dark')}"
                                  th:text="${ev.estatusValidacion ?: 'PENDIENTE'}">—</span>
                        </li>
                    </ul>
                </div>

                <form method="post"
                      th:action="@{/tutor/sesiones/{id}/evidencia(id=${sesion.id})}"
                      enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <h6 class="text-body-secondary text-uppercase mb-3" style="font-size:.72rem; letter-spacing:.08em">Nueva evidencia</h6>

                    <div class="upload-zone mb-3" id="uploadZone" onclick="document.getElementById('archivoEvidencia').click()">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p class="mb-1 fw-semibold" id="uploadLabel">Haz clic para seleccionar un archivo</p>
                        <p class="text-body-secondary small mb-0">Imagen (JPG, PNG) o PDF · máx. 10 MB</p>
                        <input type="file" id="archivoEvidencia" name="archivoEvidencia"
                               accept="image/*,.pdf" onchange="archivoSeleccionado(this)">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning text-dark flex-grow-1">Subir evidencia</button>
                        <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

            </div>
        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script>
function archivoSeleccionado(input) {
    var zone = document.getElementById('uploadZone');
    var label = document.getElementById('uploadLabel');
    if (input.files && input.files[0]) {
        label.textContent = input.files[0].name;
        zone.classList.add('has-file');
    } else {
        label.textContent = 'Haz clic para seleccionar un archivo';
        zone.classList.remove('has-file');
    }
}
</script>
</body>
</html>
