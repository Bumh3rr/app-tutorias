<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
    <style>
        .tutorado-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.07);
            cursor: pointer;
            transition: background .15s, border-color .15s;
            user-select: none;
        }
        .tutorado-row:hover { background: rgba(255,255,255,0.06); }
        .tutorado-row.presente { background: rgba(25,135,84,0.13); border-color: rgba(25,135,84,0.35); }
        .asistio-badge { display: none; font-size: .7rem; }
        .tutorado-row.presente .asistio-badge { display: inline; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Registrar asistencia</h3>
                    <p class="text-body-secondary mb-0">
                        Semana <span th:text="${sesion.semana}">?</span>
                        &mdash; <span th:text="${sesion.grupo?.nombre ?: '—'}"></span>
                    </p>
                </div>
                <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary btn-sm">← Sesión</a>
            </div>

            <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show mb-3">
                <span th:text="${msg_error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form method="post" th:action="@{/tutor/sesiones/{id}/asistencia(id=${sesion.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="glass-surface mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="section-title mb-0">Tutorados del grupo</h6>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="marcarTodos(true)">Marcar todos</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="marcarTodos(false)">Desmarcar todos</button>
                        </div>
                    </div>
                    <div th:if="${tutorados.isEmpty()}" class="text-center text-body-secondary py-4 small">
                        No hay tutorados registrados en este grupo.
                    </div>
                    <div class="d-flex flex-column gap-2" th:unless="${tutorados.isEmpty()}">
                            <div th:each="asignacion : ${tutorados}"
                                 class="tutorado-row"
                                 th:classappend="${mapaPresente[asignacion.tutorado.id] != null and mapaPresente[asignacion.tutorado.id] == 1} ? 'presente' : ''"
                                 th:attr="data-id=${asignacion.tutorado.id}"
                                 onclick="toggleRow(this)">
                                <input type="checkbox"
                                       class="form-check-input flex-shrink-0"
                                       name="idsTutoradosPresentes"
                                       th:id="'asistencia_' + ${asignacion.tutorado.id}"
                                       th:value="${asignacion.tutorado.id}"
                                       th:checked="${mapaPresente[asignacion.tutorado.id] != null and mapaPresente[asignacion.tutorado.id] == 1}"
                                       style="pointer-events:none; margin-top:0">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold small" th:text="${asignacion.tutorado.nombre + ' ' + asignacion.tutorado.apellido}">—</div>
                                    <div class="text-body-secondary" style="font-size:.75rem" th:text="'NC: ' + ${asignacion.tutorado.numeroControl}">—</div>
                                </div>
                                <span class="badge bg-success asistio-badge">Asistió</span>
                            </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar asistencia</button>
                    <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script>
function toggleRow(row) {
    var id = row.dataset.id;
    var cb = document.getElementById('asistencia_' + id);
    if (!cb) return;
    cb.checked = !cb.checked;
    row.classList.toggle('presente', cb.checked);
}

function marcarTodos(estado) {
    document.querySelectorAll('.tutorado-row').forEach(function(row) {
        var id = row.dataset.id;
        var cb = document.getElementById('asistencia_' + id);
        if (cb) { cb.checked = estado; row.classList.toggle('presente', estado); }
    });
}

document.querySelectorAll('.tutorado-row').forEach(function(row) {
    var id = row.dataset.id;
    var cb = document.getElementById('asistencia_' + id);
    if (cb && cb.checked) row.classList.add('presente');
});
</script>
</body>
</html>
