<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Sesiones</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${semestreVigente != null ? semestreVigente.periodo + ' ' + semestreVigente.anio : ''}"></p>
                </div>
                <a th:href="@{/tutor/dashboard}" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
            </div>

            <div th:if="${msg_success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${msg_success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${sesiones == null or sesiones.isEmpty()}" class="alert alert-info">
                No tienes sesiones registradas en el semestre vigente.
            </div>

            <div th:if="${sesiones != null and !sesiones.isEmpty()}" class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h6 class="mb-0">Todas mis sesiones</h6>
                    <span class="badge bg-secondary" th:text="${sesiones.size()} + ' sesiones'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Grupo</th>
                                    <th class="text-center">Semana</th>
                                    <th>Fecha</th>
                                    <th>Actividad PAT</th>
                                    <th>Estatus</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${sesiones}">
                                    <td>
                                        <span class="fw-semibold" th:text="${s.grupo?.nombre ?: '—'}">—</span>
                                        <span class="text-body-secondary small d-block"
                                              th:text="${s.grupo?.carrera?.nombre ?: ''}"></span>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-secondary" th:text="${s.semana}">0</span>
                                    </td>
                                    <td th:text="${#temporals.format(s.fechaImparticion, 'dd/MM/yyyy')}">—</td>
                                    <td th:text="${s.actividad?.nombre ?: '—'}">—</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${s.estatusRegistro == 'REALIZADA' ? 'bg-success' : (s.estatusRegistro == 'CANCELADA' ? 'bg-danger' : 'bg-warning text-dark')}"
                                              th:text="${s.estatusRegistro ?: 'PENDIENTE'}">—</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/tutor/sesiones/{id}(id=${s.id})}"
                                           class="btn btn-sm btn-primary">Operar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
