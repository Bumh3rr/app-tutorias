<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Mi Cuenta</h3>
                    <p>Gestiona tus datos de acceso al sistema.</p>
                </div>
            </div>

            <div th:if="${msg_success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${msg_success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${msg_error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">

                <!-- Información del usuario -->
                <div class="col-md-5">
                    <div class="card h-100">
                        <div class="card-header">
                            <h6 class="mb-0">Información de la cuenta</h6>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label text-muted small">Usuario</label>
                                <p class="fw-semibold" th:text="${usuario?.username}">—</p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small">Rol</label>
                                <p>
                                    <span class="badge bg-primary" th:text="${usuario?.rol}">—</span>
                                </p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small">Estado</label>
                                <p>
                                    <span class="badge"
                                          th:classappend="${usuario?.activo ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${usuario?.activo ? 'Activo' : 'Inactivo'}">—</span>
                                </p>
                            </div>
                            <div class="mb-0">
                                <label class="form-label text-muted small">Cuenta creada</label>
                                <p th:text="${#temporals.format(usuario?.fechaCreacion, 'dd/MM/yyyy HH:mm')}">—</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cambiar contraseña -->
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="mb-0">Cambiar contraseña</h6>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/mi-cuenta/cambiar-password}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <div class="mb-3">
                                    <label class="form-label" for="passwordActual">Contraseña actual</label>
                                    <input type="password" id="passwordActual" name="passwordActual"
                                           class="form-control" required autocomplete="current-password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="passwordNueva">Nueva contraseña</label>
                                    <input type="password" id="passwordNueva" name="passwordNueva"
                                           class="form-control" required minlength="6" autocomplete="new-password">
                                    <div class="form-text">Mínimo 6 caracteres.</div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label" for="passwordConfirm">Confirmar nueva contraseña</label>
                                    <input type="password" id="passwordConfirm" name="passwordConfirm"
                                           class="form-control" required minlength="6" autocomplete="new-password">
                                </div>
                                <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
