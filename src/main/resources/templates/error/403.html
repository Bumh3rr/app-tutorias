<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #080a0f; color: rgba(255,255,255,0.85); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px 20px; }
        .code { font-size: 96px; font-weight: 700; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 32px; }
        .btn { display: inline-block; padding: 11px 28px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="code">403</div>
    <h1>Acceso denegado</h1>
    <p>No tienes permisos para acceder a esta página.</p>
    <a th:href="@{/}" class="btn">Volver al inicio</a>
</div>
</body>
</html>
