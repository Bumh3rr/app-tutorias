<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutores | Subdirector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Personal — Tutores</h3>
                    <p th:if="${semestre != null}"
                       th:text="'Semestre vigente: ' + ${semestre.periodo} + ' ' + ${semestre.anio}">Semestre</p>
                </div>
                <a th:href="@{/subdirector/dashboard}" class="btn btn-sm btn-outline-secondary">
                    ← Dashboard
                </a>
            </div>

            <div th:if="${msg_warning}" class="alert alert-warning alert-dismissible fade show mb-4" role="alert">
                <span th:text="${msg_warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filtro por carrera -->
            <div class="card mb-4">
                <div class="card-body py-3">
                    <form th:action="@{/subdirector/tutores}" method="get" class="d-flex align-items-center gap-3 flex-wrap">
                        <label class="form-label mb-0 fw-semibold" style="white-space:nowrap">Filtrar por carrera:</label>
                        <select name="idCarrera" class="form-select form-select-sm" style="max-width:320px">
                            <option value="">— Todas las carreras —</option>
                            <option th:each="c : ${carreras}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}"
                                    th:selected="${c.id == idCarreraSeleccionada}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Filtrar</button>
                        <a th:href="@{/subdirector/tutores}" class="btn btn-sm btn-outline-secondary">Limpiar</a>
                    </form>
                </div>
            </div>

            <!-- Tabla de tutores -->
            <div class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h6 class="mb-0">Tutores del semestre vigente</h6>
                    <span class="badge bg-primary rounded-pill"
                          th:text="${tutorGrupos.size()} + ' registros'">0 registros</span>
                </div>
                <div class="card-body p-0">

                    <div th:if="${tutorGrupos == null or tutorGrupos.isEmpty()}" class="p-4 text-center">
                        <div class="alert alert-info mb-0">
                            No hay información disponible para este semestre.
                        </div>
                    </div>

                    <div th:if="${tutorGrupos != null and !tutorGrupos.isEmpty()}" class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Nombre completo</th>
                                    <th>Núm. control</th>
                                    <th>Carrera</th>
                                    <th>Grupo asignado</th>
                                    <th class="text-center">Estatus</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r, i : ${tutorGrupos}" class="fade-in-up">
                                    <td class="text-muted" th:text="${i.count}">1</td>
                                    <td th:text="${r['nombre']}">—</td>
                                    <td><code th:text="${r['numeroControl']}">—</code></td>
                                    <td th:text="${r['carrera']}">—</td>
                                    <td th:text="${r['grupo']}">—</td>
                                    <td class="text-center">
                                        <span th:if="${r['activo']}" class="badge bg-success">Activo</span>
                                        <span th:unless="${r['activo']}" class="badge bg-secondary">Inactivo</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
