<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Coordinador | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>

<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Panel del Coordinador</h3>
                    <p th:if="${coordinador != null}"
                       th:text="${coordinador.carrera?.nombre ?: 'Sin carrera asignada'}">Carrera</p>
                </div>
            </div>

            <div th:if="${coordinador == null}" class="alert alert-warning">
                No se encontró información de coordinador asociada a tu cuenta.
            </div>

            <div th:if="${coordinador != null}">

                <!-- Datos del coordinador -->
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <div class="card">
                            <div class="card-header"><h6 class="mb-0">Mis datos</h6></div>
                            <div class="card-body">
                                <div class="row g-2">
                                    <div class="col-12">
                                        <p class="text-muted small mb-1">Nombre</p>
                                        <p class="fw-semibold" th:text="${coordinador.nombre + ' ' + coordinador.apellido}">—</p>
                                    </div>
                                    <div class="col-12">
                                        <p class="text-muted small mb-1">Carrera</p>
                                        <p th:text="${coordinador.carrera?.nombre ?: '—'}">—</p>
                                    </div>
                                    <div class="col-12">
                                        <p class="text-muted small mb-1">Correo</p>
                                        <p th:text="${coordinador.email ?: '—'}">—</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tutores de mi carrera -->
                <div class="card" th:if="${tutores != null}">
                    <div class="card-header">
                        <h6 class="mb-0">Tutores activos en mi carrera</h6>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${tutores.isEmpty()}" class="p-4 text-center text-muted">
                            No hay tutores activos asociados a esta carrera.
                        </div>
                        <div th:if="${!tutores.isEmpty()}" class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="t : ${tutores}" class="fade-in-up">
                                        <td th:text="${t.nombre + ' ' + t.apellido}">—</td>
                                        <td th:text="${t.email ?: '—'}">—</td>
                                        <td>
                                            <span class="badge bg-success">Activo</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
