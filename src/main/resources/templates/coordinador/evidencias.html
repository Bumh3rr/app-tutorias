<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Evidencias | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Validar Evidencias</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${coordinador?.carrera?.nombre ?: ''}">Carrera</p>
                </div>
                <a th:href="@{/coordinador}" class="btn btn-outline-secondary btn-sm">← Inicio</a>
            </div>

            <!-- Filtros de estatus -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <a th:href="@{/coordinador/evidencias}"
                   th:classappend="${estatusFiltro == null or #strings.isEmpty(estatusFiltro) ? 'btn-secondary' : 'btn-outline-secondary'}"
                   class="btn btn-sm">Todas</a>
                <a th:href="@{/coordinador/evidencias(estatus='PENDIENTE')}"
                   th:classappend="${'PENDIENTE'.equals(estatusFiltro) ? 'btn-warning' : 'btn-outline-warning'}"
                   class="btn btn-sm text-dark">Pendientes</a>
                <a th:href="@{/coordinador/evidencias(estatus='VALIDADA')}"
                   th:classappend="${'VALIDADA'.equals(estatusFiltro) ? 'btn-success' : 'btn-outline-success'}"
                   class="btn btn-sm">Validadas</a>
                <a th:href="@{/coordinador/evidencias(estatus='RECHAZADA')}"
                   th:classappend="${'RECHAZADA'.equals(estatusFiltro) ? 'btn-danger' : 'btn-outline-danger'}"
                   class="btn btn-sm">Rechazadas</a>
            </div>

            <div th:if="${evidencias == null or evidencias.isEmpty()}" class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="mb-3" style="opacity:.3">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <h5>Sin evidencias</h5>
                <p th:text="${'PENDIENTE'.equals(estatusFiltro) ? 'No hay evidencias pendientes de validación.' : 'No se encontraron evidencias con el filtro seleccionado.'}">—</p>
            </div>

            <div th:if="${evidencias != null and !evidencias.isEmpty()}" class="glass-surface">
                <div class="table-wrapper">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Semana</th>
                                    <th>Grupo</th>
                                    <th>Tutor</th>
                                    <th>Fecha subida</th>
                                    <th class="text-center">Estatus</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${evidencias}">
                                    <td>
                                        <span class="badge bg-secondary"
                                              th:text="${e.sesion?.semana != null ? 'Semana ' + e.sesion.semana : '—'}">—</span>
                                    </td>
                                    <td th:text="${e.sesion?.grupo?.nombre ?: '—'}">—</td>
                                    <td class="small text-body-secondary"
                                        th:text="${e.sesion?.grupo?.tutor != null ? e.sesion.grupo.tutor.nombre + ' ' + e.sesion.grupo.tutor.apellido : '—'}">—</td>
                                    <td class="small text-body-secondary"
                                        th:text="${e.fechaSubida != null ? #dates.format(e.fechaSubida, 'dd/MM/yyyy') : '—'}">—</td>
                                    <td class="text-center">
                                        <span class="badge"
                                              th:classappend="${'VALIDADA'.equals(e.estatusValidacion) ? 'bg-success' : ('RECHAZADA'.equals(e.estatusValidacion) ? 'bg-danger' : 'bg-warning text-dark')}"
                                              th:text="${e.estatusValidacion ?: 'PENDIENTE'}">—</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{'/coordinador/evidencias/' + ${e.id}}"
                                           class="btn btn-outline-secondary btn-sm">Ver</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
