<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tutores | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Mis Tutores</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${coordinador?.carrera?.nombre ?: ''}">Carrera</p>
                </div>
                <a th:href="@{/coordinador}" class="btn btn-outline-secondary btn-sm">← Inicio</a>
            </div>

            <div th:if="${tutores == null or tutores.isEmpty()}" class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="mb-3" style="opacity:.3">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <h5>Sin tutores registrados</h5>
                <p>No hay tutores activos con grupos asignados en tu carrera para este semestre.</p>
            </div>

            <div th:if="${tutores != null and !tutores.isEmpty()}" class="glass-surface">
                <div class="table-wrapper">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>N° Control</th>
                                    <th>Correo</th>
                                    <th class="text-center">Grupos</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="tutor : ${tutores}">
                                    <td>
                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                            <div style="width:32px;height:32px;border-radius:50%;background:rgba(99,102,241,.25);color:#818cf8;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;flex-shrink:0"
                                                 th:text="${#strings.substring(tutor.nombre,0,1) + #strings.substring(tutor.apellido,0,1)}">AB</div>
                                            <span th:text="${tutor.nombre + ' ' + tutor.apellido}">—</span>
                                            <span th:if="${tutor.activo != 1}"
                                                  class="badge bg-danger" style="font-size:.65rem">INACTIVO</span>
                                        </div>
                                    </td>
                                    <td class="text-body-secondary small" th:text="${tutor.numeroControl ?: '—'}">—</td>
                                    <td class="text-body-secondary small" th:text="${tutor.email ?: '—'}">—</td>
                                    <td class="text-center">
                                        <span class="badge bg-secondary"
                                              th:text="${gruposPorTutor[tutor.id] != null ? gruposPorTutor[tutor.id].size() : 0}">0</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{'/coordinador/tutores/' + ${tutor.id}}"
                                           class="btn btn-outline-secondary btn-sm">Ver detalle</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
