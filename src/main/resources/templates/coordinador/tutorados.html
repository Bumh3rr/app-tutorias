<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tutorados | Sistema Tutorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Mis Tutorados</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${coordinador?.carrera?.nombre ?: ''}">Carrera</p>
                </div>
                <a th:href="@{/coordinador}" class="btn btn-outline-secondary btn-sm">← Inicio</a>
            </div>

            <div th:if="${grupoTutorados == null or grupoTutorados.isEmpty()}" class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="mb-3" style="opacity:.3">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <h5>Sin tutorados registrados</h5>
                <p>No hay tutorados asignados en grupos de tu carrera para este semestre.</p>
            </div>

            <div th:if="${grupoTutorados != null and !grupoTutorados.isEmpty()}" class="glass-surface">
                <div class="table-wrapper">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>N° Control</th>
                                    <th>Grupo</th>
                                    <th class="text-center">Asistencia</th>
                                    <th class="text-center">Acreditación</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ins : ${grupoTutorados}">
                                    <td>
                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                            <div style="width:32px;height:32px;border-radius:50%;background:rgba(117,183,152,.2);color:#75b798;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;flex-shrink:0"
                                                 th:text="${(ins.tutorado?.nombre != null ? #strings.substring(ins.tutorado.nombre,0,1) : '') + (ins.tutorado?.apellido != null ? #strings.substring(ins.tutorado.apellido,0,1) : '')}">AB</div>
                                            <span th:text="${(ins.tutorado?.nombre ?: '') + ' ' + (ins.tutorado?.apellido ?: '')}">—</span>
                                            <span th:if="${ins.tutorado?.activo != null and ins.tutorado.activo != 1}"
                                                  class="badge bg-danger" style="font-size:.65rem">INACTIVO</span>
                                        </div>
                                    </td>
                                    <td class="text-body-secondary small" th:text="${ins.tutorado?.numeroControl ?: '—'}">—</td>
                                    <td class="text-body-secondary small" th:text="${ins.grupo?.nombre ?: '—'}">—</td>
                                    <td class="text-center">
                                        <span th:if="${resumenMap[ins.tutorado?.id] != null}"
                                              th:style="${resumenMap[ins.tutorado.id].porcentaje >= 80 ? 'color:#75b798' : (resumenMap[ins.tutorado.id].porcentaje >= 60 ? 'color:#fbbf24' : 'color:#f87171')}"
                                              class="fw-semibold"
                                              th:text="${#numbers.formatDecimal(resumenMap[ins.tutorado.id].porcentaje, 1, 1) + '%'}">—</span>
                                        <span th:if="${resumenMap[ins.tutorado?.id] == null}" class="text-body-secondary small">—</span>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${resumenMap[ins.tutorado?.id] != null}"
                                              class="badge"
                                              th:classappend="${resumenMap[ins.tutorado.id].porcentaje >= 80 ? 'bg-success' : (resumenMap[ins.tutorado.id].porcentaje >= 60 ? 'bg-warning text-dark' : 'bg-danger')}"
                                              th:text="${resumenMap[ins.tutorado.id].porcentaje >= 80 ? 'Acreditado' : (resumenMap[ins.tutorado.id].porcentaje >= 60 ? 'En riesgo' : 'No acreditado')}">—</span>
                                        <span th:if="${resumenMap[ins.tutorado?.id] == null}" class="badge bg-secondary">Sin sesiones</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{'/coordinador/tutorados/' + ${ins.tutorado?.id}}"
                                           class="btn btn-outline-secondary btn-sm">Ver detalle</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
