<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Necesidades | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Detección de Necesidades</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${semestreVigente != null ? semestreVigente.periodo + ' ' + semestreVigente.anio : ''}"></p>
                </div>
                <a th:href="@{/tutor/dashboard}" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
            </div>

            <div th:if="${msg_success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${msg_success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${asignaciones == null or #lists.isEmpty(asignaciones)}" class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="mb-3">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <h5>Sin tutorados asignados</h5>
                <p>No tienes tutorados asignados en el semestre vigente.</p>
            </div>

            <div th:if="${asignaciones != null and !#lists.isEmpty(asignaciones)}" class="glass-surface">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="section-title mb-0">Tutorados y estado de detección</h6>
                    <div>
                        <span class="badge bg-success me-1"
                              th:text="${deteccionAplicadasCount} + ' aplicadas'">0 aplicadas</span>
                        <span class="badge bg-warning text-dark"
                              th:text="${deteccionPendientesCount} + ' pendientes'">0 pendientes</span>
                    </div>
                </div>
                <div class="table-wrapper">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Tutorado</th>
                                    <th>No. Control</th>
                                    <th>Grupo</th>
                                    <th class="text-center">Detección</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="asignacion : ${asignaciones}">
                                    <td>
                                        <span class="fw-semibold"
                                              th:text="${asignacion.tutorado.nombre + ' ' + asignacion.tutorado.apellido}">—</span>
                                    </td>
                                    <td class="text-body-secondary small"
                                        th:text="${asignacion.tutorado.numeroControl}">—</td>
                                    <td class="small" th:text="${asignacion.grupo?.nombre ?: '—'}">—</td>
                                    <td class="text-center">
                                        <span th:if="${deteccionAplicada[asignacion.tutorado.id]}"
                                              class="badge bg-success">Aplicada</span>
                                        <span th:if="${!deteccionAplicada[asignacion.tutorado.id]}"
                                              class="badge bg-warning text-dark">Pendiente</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/tutor/deteccion/{id}(id=${asignacion.tutorado.id})}"
                                           class="btn btn-sm"
                                           th:classappend="${deteccionAplicada[asignacion.tutorado.id] ? 'btn-outline-secondary' : 'btn-primary'}">
                                            <span th:text="${deteccionAplicada[asignacion.tutorado.id] ? 'Ver / nueva' : 'Aplicar ahora'}">Aplicar</span>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
