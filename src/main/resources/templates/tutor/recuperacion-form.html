<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de Asistencia | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
    <style>
        .ausente-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.07);
            cursor: pointer;
            transition: background .15s, border-color .15s;
            user-select: none;
        }
        .ausente-row:hover { background: rgba(255,255,255,0.06); }
        .ausente-row.recuperado { background: rgba(13,202,240,0.1); border-color: rgba(13,202,240,0.35); }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main d-flex justify-content-center align-items-start">
            <div class="form-card w-100 mx-auto" style="max-width: 600px;">

                <h3 class="text-center mb-1">Recuperación de asistencia</h3>
                <p class="text-center text-body-secondary small mb-4">
                    Semana <span th:text="${sesion.semana}">?</span>
                    &mdash; <span th:text="${sesion.grupo?.nombre ?: '—'}"></span>
                </p>

                <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show mb-3">
                    <span th:text="${msg_error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Estado vacío: sin faltas pendientes -->
                <div th:if="${ausentes.isEmpty()}" class="text-center py-5">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" class="mb-3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <p class="text-body-secondary mb-1">No hay faltas pendientes de recuperar</p>
                    <p class="text-body-secondary small mb-4">Todos los tutorados asistieron o ya recuperaron su falta.</p>
                    <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary">← Volver a la sesión</a>
                </div>

                <!-- Formulario de recuperación -->
                <div th:unless="${ausentes.isEmpty()}">
                    <p class="text-body-secondary small mb-3">
                        Selecciona los tutorados que recuperaron su falta de esta sesión (ej. asistiendo a un taller).
                    </p>

                    <form method="post" th:action="@{/tutor/sesiones/{id}/recuperacion(id=${sesion.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="d-flex flex-column gap-2 mb-4">
                            <div th:each="a : ${ausentes}"
                                 class="ausente-row"
                                 th:attr="data-id=${a.tutorado.id}"
                                 onclick="toggleAusente(this)">
                                <input type="checkbox"
                                       class="form-check-input flex-shrink-0"
                                       name="idsRecuperados"
                                       th:id="'rec_' + ${a.tutorado.id}"
                                       th:value="${a.tutorado.id}"
                                       style="pointer-events:none; margin-top:0">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold small" th:text="${a.tutorado.nombre + ' ' + a.tutorado.apellido}">—</div>
                                    <div class="text-body-secondary" style="font-size:.75rem" th:text="'NC: ' + ${a.tutorado.numeroControl}">—</div>
                                </div>
                                <span class="badge bg-danger" style="font-size:.7rem">Falta</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-outline-success flex-grow-1">Registrar recuperaciones</button>
                            <a th:href="@{/tutor/sesiones/{id}(id=${sesion.id})}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>

            </div>
        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script>
function toggleAusente(row) {
    var id = row.dataset.id;
    var cb = document.getElementById('rec_' + id);
    if (!cb) return;
    cb.checked = !cb.checked;
    row.classList.toggle('recuperado', cb.checked);
}
</script>
</body>
</html>
