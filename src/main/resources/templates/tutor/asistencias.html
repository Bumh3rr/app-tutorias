<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
    <style>
        .progress { height: 6px; }
        .pct-ok  { color: #75b798; }
        .pct-warn { color: #ffda6a; }
        .pct-bad  { color: #ea868f; }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main">

            <div class="page-header">
                <div>
                    <h3>Asistencias de mis tutorados</h3>
                    <p class="text-body-secondary mb-0"
                       th:text="${semestreVigente != null ? semestreVigente.periodo + ' ' + semestreVigente.anio : ''}"></p>
                </div>
                <a th:href="@{/tutor/dashboard}" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
            </div>

            <div th:if="${resumenes == null or resumenes.isEmpty()}" class="alert alert-info">
                No hay tutorados asignados o aún no se han registrado sesiones en este semestre.
            </div>

            <div th:if="${resumenes != null and !resumenes.isEmpty()}">

                <!-- Resumen rápido -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card text-center py-3">
                            <div class="h2 fw-bold text-success mb-0"
                                 th:text="${#lists.size(resumenes.?[porcentaje >= 80])}">0</div>
                            <div class="text-body-secondary small">Acreditados (≥ 80%)</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center py-3">
                            <div class="h2 fw-bold text-warning mb-0"
                                 th:text="${#lists.size(resumenes.?[porcentaje < 80])}">0</div>
                            <div class="text-body-secondary small">En riesgo (&lt; 80%)</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center py-3">
                            <div class="h2 fw-bold mb-0" th:text="${resumenes.size()}">0</div>
                            <div class="text-body-secondary small">Total de tutorados</div>
                        </div>
                    </div>
                </div>

                <!-- Tabla detallada -->
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">Detalle por tutorado</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Tutorado</th>
                                        <th>Grupo</th>
                                        <th class="text-center">Sesiones</th>
                                        <th class="text-center">Asistió</th>
                                        <th class="text-center">Recuperó</th>
                                        <th style="min-width:140px">Porcentaje</th>
                                        <th class="text-center">Estatus</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="r : ${resumenes}"
                                        th:classappend="${r.porcentaje < 80 ? 'table-warning bg-opacity-10' : ''}">
                                        <td>
                                            <span class="fw-semibold" th:text="${r.nombreTutorado}">—</span>
                                        </td>
                                        <td class="small text-body-secondary"
                                            th:text="${grupoPorTutorado[r.idTutorado]?.nombre ?: '—'}">—</td>
                                        <td class="text-center" th:text="${r.totalSesiones}">0</td>
                                        <td class="text-center" th:text="${r.asistenciasPresente}">0</td>
                                        <td class="text-center" th:text="${r.asistenciasRecuperadas}">0</td>
                                        <td>
                                            <div class="d-flex align-items-center gap-2">
                                                <div class="progress flex-grow-1">
                                                    <div class="progress-bar"
                                                         th:classappend="${r.porcentaje >= 80 ? 'bg-success' : (r.porcentaje >= 60 ? 'bg-warning' : 'bg-danger')}"
                                                         th:style="'width:' + ${r.porcentaje} + '%'"
                                                         role="progressbar"></div>
                                                </div>
                                                <small class="fw-semibold"
                                                       th:classappend="${r.porcentaje >= 80 ? 'pct-ok' : (r.porcentaje >= 60 ? 'pct-warn' : 'pct-bad')}"
                                                       th:text="${#numbers.formatDecimal(r.porcentaje, 1, 1)} + '%'">0%</small>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge"
                                                  th:classappend="${r.acreditado ? 'bg-success' : 'bg-warning text-dark'}"
                                                  th:text="${r.acreditado ? 'Acreditado' : 'En riesgo'}">—</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
