<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicar Detección | Mi Tutoría</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/sidebar.css}">
    <style>
        .necesidad-card {
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.08);
            border-radius: var(--bs-border-radius);
            padding: 16px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .necesidad-card:hover { background: rgba(255,255,255,0.06); }
        .necesidad-card.selected { background: rgba(220,53,69,0.12); border-color: rgba(220,53,69,0.4); }
    </style>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/fragment::sidebar}"></div>
    <div class="app-content">
        <main class="app-main d-flex justify-content-center align-items-start">
            <div class="form-card w-100 mx-auto" style="max-width: 640px;">

                <h3 class="text-center mb-1">Detección de Necesidades</h3>
                <p class="text-center text-body-secondary small mb-4"
                   th:text="${tutorado.nombre + ' ' + tutorado.apellido + ' · NC: ' + tutorado.numeroControl}"></p>

                <div th:if="${msg_error}" class="alert alert-danger alert-dismissible fade show mb-3">
                    <span th:text="${msg_error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form method="post"
                      th:action="@{/tutor/deteccion/{id}(id=${tutorado.id})}"
                      th:object="${deteccion}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Sesión (parámetro suelto, no binding directo) -->
                    <div class="mb-4" th:if="${sesiones != null and !sesiones.isEmpty()}">
                        <label class="form-label fw-semibold">Sesión asociada <span class="text-body-secondary fw-normal">(opcional)</span></label>
                        <select class="form-select" name="idSesion">
                            <option value="">— Sin sesión específica —</option>
                            <option th:each="s : ${sesiones}"
                                    th:value="${s.id}"
                                    th:text="'Semana ' + ${s.semana} + ' · ' + ${#temporals.format(s.fechaImparticion, 'dd/MM/yyyy')} + ' · ' + ${s.grupo.nombre}">
                            </option>
                        </select>
                    </div>

                    <!-- Necesidades académicas -->
                    <h6 class="text-body-secondary text-uppercase mb-3" style="font-size:.72rem; letter-spacing:.08em">Necesidades académicas</h6>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'necesidadAlgebra')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="necesidadAlgebra"
                                           th:field="*{necesidadAlgebra}" value="1">
                                    <label class="form-check-label fw-semibold" for="necesidadAlgebra">Álgebra</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'necesidadCalculo')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="necesidadCalculo"
                                           th:field="*{necesidadCalculo}" value="1">
                                    <label class="form-check-label fw-semibold" for="necesidadCalculo">Cálculo</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'necesidadDerecho')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="necesidadDerecho"
                                           th:field="*{necesidadDerecho}" value="1">
                                    <label class="form-check-label fw-semibold" for="necesidadDerecho">Intro. al Derecho</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'necesidadPsicologica')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="necesidadPsicologica"
                                           th:field="*{necesidadPsicologica}" value="1">
                                    <label class="form-check-label fw-semibold" for="necesidadPsicologica">Apoyo psicológico</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small">Otra necesidad académica</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{necesidadOtra}" placeholder="Especificar si aplica">
                        </div>
                        <div class="col-12" id="temaPsiSection" style="display:none">
                            <label class="form-label small">Tema psicológico a atender</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{temaPsicologico}" placeholder="Describe brevemente">
                        </div>
                    </div>

                    <!-- Necesidades económicas -->
                    <h6 class="text-body-secondary text-uppercase mb-3" style="font-size:.72rem; letter-spacing:.08em">Situación económica</h6>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'necesidadEconomica')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="necesidadEconomica"
                                           th:field="*{necesidadEconomica}" value="1">
                                    <label class="form-check-label fw-semibold" for="necesidadEconomica">Apoyo económico</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'tieneBeca')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tieneBeca"
                                           th:field="*{tieneBeca}" value="1">
                                    <label class="form-check-label fw-semibold" for="tieneBeca">Solicita beca</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12" id="becaSection" style="display:none">
                            <label class="form-label small">Nombre / tipo de beca</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{nombreBeca}" placeholder="Ej. Beca Bienestar">
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'tieneEscasezMateriales')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tieneEscasezMateriales"
                                           th:field="*{tieneEscasezMateriales}" value="1">
                                    <label class="form-check-label fw-semibold" for="tieneEscasezMateriales">Escasez de materiales</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12" id="materialesSection" style="display:none">
                            <label class="form-label small">Materiales requeridos</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{materialesRequeridos}" placeholder="Describe los materiales">
                        </div>
                    </div>

                    <!-- Salud y familia -->
                    <h6 class="text-body-secondary text-uppercase mb-3" style="font-size:.72rem; letter-spacing:.08em">Salud y familia</h6>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'tieneAtencionMedica')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tieneAtencionMedica"
                                           th:field="*{tieneAtencionMedica}" value="1">
                                    <label class="form-check-label fw-semibold" for="tieneAtencionMedica">Atención médica</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12" id="medSection" style="display:none">
                            <label class="form-label small">Especificación médica</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{especificacionMedica}" placeholder="Detalla la situación">
                        </div>
                        <div class="col-6">
                            <div class="necesidad-card" onclick="toggleNecesidad(this, 'tieneVinculacionFamilia')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tieneVinculacionFamilia"
                                           th:field="*{tieneVinculacionFamilia}" value="1">
                                    <label class="form-check-label fw-semibold" for="tieneVinculacionFamilia">Vinculación familiar</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12" id="familiaSection" style="display:none">
                            <label class="form-label small">Motivo de vinculación familiar</label>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{razonVinculacion}" placeholder="Describe el motivo">
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Observaciones generales</label>
                        <textarea class="form-control" rows="3"
                                  th:field="*{observaciones}" placeholder="Cualquier anotación adicional..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Guardar detección</button>
                        <a th:href="@{/tutor/deteccion}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

            </div>
        </main>
        <div th:replace="~{fragments/fragment::footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script>
function toggleNecesidad(card, checkboxId) {
    const cb = document.getElementById(checkboxId);
    if (!cb) return;
    cb.checked = !cb.checked;
    card.classList.toggle('selected', cb.checked);
    // Mostrar/ocultar campos dependientes
    const deps = {
        'necesidadPsicologica': 'temaPsiSection',
        'tieneBeca':           'becaSection',
        'tieneEscasezMateriales': 'materialesSection',
        'tieneAtencionMedica': 'medSection',
        'tieneVinculacionFamilia': 'familiaSection'
    };
    if (deps[checkboxId]) {
        const sec = document.getElementById(deps[checkboxId]);
        if (sec) sec.style.display = cb.checked ? '' : 'none';
    }
}
// Inicializar estado de cards al cargar
document.querySelectorAll('.necesidad-card input[type=checkbox]').forEach(cb => {
    if (cb.checked) cb.closest('.necesidad-card')?.classList.add('selected');
});
</script>
</body>
</html>
